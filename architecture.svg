<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Sales Lead Management Tool Architecture</title>
  <desc id="description">Architecture diagram showing the browser, Next.js frontend, Express API, Inngest runtime, Prisma, and PostgreSQL, including lead creation, updates, workflow assignment, and transactional conversion.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183153" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #10213b; font-size: 34px; font-weight: 750; letter-spacing: -0.7px; }
      .subtitle { fill: #61718a; font-size: 16px; }
      .eyebrow { fill: #2563eb; font-size: 12px; font-weight: 750; letter-spacing: 2.6px; }
      .card-title { fill: #12233d; font-size: 19px; font-weight: 700; }
      .card-sub { fill: #6b7c93; font-size: 13px; }
      .body { fill: #30435e; font-size: 14px; }
      .small { fill: #61718a; font-size: 12px; }
      .tiny { fill: #61718a; font-size: 11px; }
      .pill { fill: #1e40af; font-size: 11px; font-weight: 700; }
      .white { fill: #ffffff; }
      .line-label { fill: #50617a; font-size: 11px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#page)"/>
  <circle cx="1470" cy="90" r="170" fill="#dbeafe" opacity="0.35"/>
  <circle cx="145" cy="1020" r="210" fill="#e0e7ff" opacity="0.32"/>

  <text x="64" y="56" class="eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="64" y="103" class="title">Sales Lead Management Tool</text>
  <text x="64" y="134" class="subtitle">Application components and the lead lifecycle, from inbox actions to asynchronous workflows and persistent records.</text>
  <g transform="translate(1270 65)">
    <rect width="266" height="42" rx="21" fill="#e7efff"/>
    <circle cx="22" cy="21" r="5" fill="#2563eb"/>
    <text x="38" y="26" class="small" font-weight="700">LOCAL DEVELOPMENT TOPOLOGY</text>
  </g>

  <!-- Browser client -->
  <g filter="url(#shadow)">
    <rect x="58" y="246" width="205" height="242" rx="20" fill="#ffffff" stroke="#dce5f1"/>
  </g>
  <rect x="78" y="268" width="165" height="105" rx="12" fill="#f2f6fc" stroke="#e1e9f4"/>
  <rect x="78" y="268" width="165" height="17" rx="12" fill="#e6edf7"/>
  <circle cx="91" cy="277" r="3" fill="#fb7185"/>
  <circle cx="102" cy="277" r="3" fill="#fbbf24"/>
  <circle cx="113" cy="277" r="3" fill="#34d399"/>
  <rect x="91" y="298" width="65" height="8" rx="4" fill="#c9d7eb"/>
  <rect x="91" y="316" width="137" height="7" rx="3.5" fill="#d9e3f0"/>
  <rect x="91" y="333" width="137" height="7" rx="3.5" fill="#d9e3f0"/>
  <rect x="91" y="350" width="78" height="8" rx="4" fill="#93b4f7"/>
  <text x="78" y="407" class="card-title">User / Browser</text>
  <text x="78" y="432" class="body">Salesperson uses the</text>
  <text x="78" y="452" class="body">lead inbox and detail page.</text>
  <rect x="78" y="464" width="112" height="0" fill="none"/>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="320" y="204" width="360" height="326" rx="22" fill="#ffffff" stroke="#cfe0ff" stroke-width="1.5"/>
  </g>
  <rect x="320" y="204" width="360" height="9" rx="5" fill="url(#blue)"/>
  <g transform="translate(345 232)">
    <rect width="38" height="38" rx="11" fill="#e9f0ff"/>
    <path d="M12 12h14v14H12z M16 8h14v14" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="395" y="250" class="card-title">Next.js Web App</text>
  <text x="395" y="270" class="card-sub">App Router · React · Tailwind CSS</text>
  <line x1="345" y1="291" x2="655" y2="291" stroke="#e7edf6"/>
  <circle cx="357" cy="320" r="4" fill="#2563eb"/>
  <text x="372" y="325" class="body">Lead inbox and lead creation</text>
  <circle cx="357" cy="352" r="4" fill="#2563eb"/>
  <text x="372" y="357" class="body">Details, tasks, activity timeline</text>
  <circle cx="357" cy="384" r="4" fill="#2563eb"/>
  <text x="372" y="389" class="body">Status update and conversion UI</text>
  <rect x="345" y="414" width="309" height="79" rx="13" fill="#f5f8ff"/>
  <text x="362" y="441" class="small" font-weight="700">CLIENT DATA</text>
  <text x="362" y="465" class="body">SWR fetches API data and revalidates</text>
  <text x="362" y="484" class="body">after user actions.</text>

  <!-- API / application server -->
  <g filter="url(#shadow)">
    <rect x="741" y="184" width="397" height="390" rx="22" fill="#ffffff" stroke="#c9d5e5" stroke-width="1.5"/>
  </g>
  <rect x="741" y="184" width="397" height="9" rx="5" fill="#243b5a"/>
  <g transform="translate(766 212)">
    <rect width="38" height="38" rx="11" fill="#eaf0f7"/>
    <path d="M11 12h16l-8 14-8-14z M13 29h12" fill="none" stroke="#34516f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="816" y="230" class="card-title">Express API Server</text>
  <text x="816" y="250" class="card-sub">Node.js · TypeScript · Zod validation</text>
  <line x1="766" y1="270" x2="1113" y2="270" stroke="#e7edf6"/>
  <text x="766" y="296" class="small" font-weight="750">REST ROUTES</text>
  <text x="766" y="321" class="body">GET /leads · GET /leads/:id</text>
  <text x="766" y="344" class="body">POST /leads · PATCH /leads/:id</text>
  <text x="766" y="367" class="body">POST /:id/activity · POST /:id/convert</text>
  <rect x="766" y="388" width="347" height="56" rx="12" fill="#f2f5fa"/>
  <text x="782" y="411" class="small" font-weight="750">INNGEST FUNCTION SERVE</text>
  <text x="782" y="430" class="body">POST /api/inngest</text>
  <rect x="766" y="458" width="347" height="86" rx="12" fill="#eef6ff"/>
  <text x="782" y="482" class="small" font-weight="750">PRISMA CLIENT + PostgreSQL ADAPTER</text>
  <text x="782" y="504" class="body">Handles API queries and workflow writes</text>
  <text x="782" y="525" class="body">against the same relational database.</text>

  <!-- Inngest runtime -->
  <g filter="url(#shadow)">
    <rect x="1200" y="220" width="340" height="300" rx="22" fill="#ffffff" stroke="#dfd2ff" stroke-width="1.5"/>
  </g>
  <rect x="1200" y="220" width="340" height="9" rx="5" fill="#7c3aed"/>
  <g transform="translate(1225 247)">
    <rect width="38" height="38" rx="11" fill="#f1eaff"/>
    <path d="M20 7l-8 13h7l-2 11 10-15h-7l2-9z" fill="#7c3aed"/>
  </g>
  <text x="1275" y="266" class="card-title">Inngest Runtime</text>
  <text x="1275" y="286" class="card-sub">Dev Server locally · hosted runtime in production</text>
  <line x1="1225" y1="305" x2="1515" y2="305" stroke="#eee8fa"/>
  <text x="1225" y="332" class="small" font-weight="750">EVENTS</text>
  <rect x="1225" y="345" width="131" height="27" rx="13.5" fill="#f1eaff"/>
  <text x="1238" y="363" class="pill">lead/created</text>
  <rect x="1366" y="345" width="149" height="27" rx="13.5" fill="#f1eaff"/>
  <text x="1379" y="363" class="pill">lead/updated</text>
  <text x="1225" y="402" class="body">Runs registered functions through</text>
  <text x="1225" y="423" class="body">the backend's /api/inngest endpoint.</text>
  <text x="1225" y="460" class="small">Retries and step orchestration</text>
  <text x="1225" y="480" class="small">are managed by Inngest.</text>

  <!-- Flow connectors top -->
  <path d="M263 351 H320" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <circle cx="289" cy="351" r="13" fill="#2563eb"/>
  <text x="285" y="355" class="white" font-size="11" font-weight="800">1</text>
  <text x="270" y="331" class="line-label">interacts</text>

  <path d="M680 351 H741" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <circle cx="708" cy="351" r="13" fill="#2563eb"/>
  <text x="704" y="355" class="white" font-size="11" font-weight="800">2</text>
  <text x="680" y="331" class="line-label">HTTPS / JSON</text>

  <path d="M1138 320 H1200" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <circle cx="1168" cy="320" r="13" fill="#7c3aed"/>
  <text x="1164" y="324" class="white" font-size="11" font-weight="800">3</text>
  <text x="1137" y="300" class="line-label">send event</text>

  <path d="M1200 457 H1167 Q1150 457 1150 440 V410 Q1150 392 1132 392 H1138" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="1156" y="477" class="line-label">invoke registered function</text>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="650" y="670" width="518" height="292" rx="22" fill="#ffffff" stroke="#b8e2dc" stroke-width="1.5"/>
  </g>
  <rect x="650" y="670" width="518" height="9" rx="5" fill="#0f766e"/>
  <g transform="translate(678 699)">
    <ellipse cx="20" cy="10" rx="16" ry="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <path d="M4 10v22c0 4 7 7 16 7s16-3 16-7V10 M4 21c0 4 7 7 16 7s16-3 16-7" fill="#e6fffb" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="728" y="715" class="card-title">PostgreSQL Database</text>
  <text x="728" y="737" class="card-sub">Relational source of truth · Prisma ORM 7</text>
  <rect x="678" y="765" width="462" height="80" rx="13" fill="#f0fdfa"/>
  <text x="698" y="792" class="small" font-weight="750">CORE ENTITIES</text>
  <text x="698" y="818" class="body">Lead · Salesperson · Task · ActivityLog</text>
  <text x="698" y="838" class="body">Contact · Deal</text>
  <rect x="678" y="864" width="462" height="69" rx="13" fill="#ecfdf5"/>
  <text x="698" y="890" class="small" font-weight="750">CONVERSION TRANSACTION</text>
  <text x="698" y="914" class="body">Create Contact + Deal · mark Lead converted · log event</text>

  <!-- Workflow behavior panel -->
  <g filter="url(#shadow)">
    <rect x="1200" y="620" width="340" height="342" rx="22" fill="#ffffff" stroke="#dfd2ff" stroke-width="1.5"/>
  </g>
  <text x="1225" y="660" class="card-title">Workflow behavior</text>
  <text x="1225" y="684" class="card-sub">Executed by backend functions</text>
  <rect x="1225" y="711" width="290" height="104" rx="14" fill="#f7f3ff"/>
  <circle cx="1246" cy="735" r="12" fill="#7c3aed"/>
  <text x="1242" y="739" class="white" font-size="11" font-weight="800">A</text>
  <text x="1267" y="739" class="body" font-weight="700">lead/created</text>
  <text x="1240" y="770" class="small">Choose salesperson at random</text>
  <text x="1240" y="790" class="small">Create initial call task + audit entries</text>
  <rect x="1225" y="830" width="290" height="104" rx="14" fill="#f7f3ff"/>
  <circle cx="1246" cy="854" r="12" fill="#7c3aed"/>
  <text x="1242" y="858" class="white" font-size="11" font-weight="800">B</text>
  <text x="1267" y="858" class="body" font-weight="700">lead/updated</text>
  <text x="1240" y="889" class="small">Persist change details in ActivityLog</text>
  <text x="1240" y="909" class="small">Manual notes are written directly by API</text>

  <!-- Backend to database -->
  <path d="M939 574 V670" fill="none" stroke="#0f766e" stroke-width="3" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <circle cx="939" cy="619" r="13" fill="#0f766e"/>
  <text x="935" y="623" class="white" font-size="11" font-weight="800">4</text>
  <rect x="960" y="602" width="174" height="34" rx="17" fill="#e6fffb" stroke="#b8e2dc"/>
  <text x="974" y="623" class="line-label">Prisma queries / writes</text>

  <!-- Legend / footer -->
  <g transform="translate(64 1010)">
    <text x="0" y="0" class="small" font-weight="750">FLOW KEY</text>
    <line x1="88" y1="-5" x2="130" y2="-5" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="140" y="0" class="small">user / API request</text>
    <line x1="290" y1="-5" x2="332" y2="-5" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="342" y="0" class="small">event / function invocation</text>
    <line x1="535" y1="-5" x2="577" y2="-5" stroke="#0f766e" stroke-width="3" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
    <text x="587" y="0" class="small">database read / write</text>
    <line x1="770" y1="-5" x2="812" y2="-5" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
    <text x="822" y="0" class="small">Inngest invokes backend function</text>
  </g>
  <text x="64" y="1054" class="tiny">Lead conversion is synchronous and transactional; assignment and update auditing run asynchronously through Inngest.</text>
  <text x="1536" y="1054" text-anchor="end" class="tiny">KEYLOOP CODING ASSIGNMENT</text>
</svg>
